<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cream Audio Player</title>
<style>
:root{--accent:#b9a083;--soft:#e6d9c8;--ink:#403b35;--muted:#9b9083;--paper:#fffdf8;--record:#191919;--label:#e8cf91;--wave:#c8ad91}
body[data-theme="rose"]{--accent:#bd8e91;--soft:#f0dedd;--ink:#594442;--paper:#fff9f7;--label:#e8c4c2;--wave:#d7aaa9}
body[data-theme="sage"]{--accent:#87967e;--soft:#e0e7dc;--ink:#424b40;--paper:#fbfcf8;--label:#d0d9bd;--wave:#aebca4}
body[data-theme="lavender"]{--accent:#a79ab9;--soft:#e8e2ef;--ink:#514a5c;--paper:#fcfaff;--label:#d9cde8;--wave:#c0b2d1}
body[data-theme="night"]{--accent:#c6a878;--soft:#3a332e;--ink:#eee4d7;--paper:#211e1b;--label:#e1c66b;--wave:#b9a18a}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;padding:0;background:transparent!important;font:14px/1.45 Georgia,'Times New Roman',serif;color:var(--ink)}button{font:inherit;cursor:pointer}.wrap{width:100%;margin:0 auto;padding:0;background:transparent}.card{width:100%;background:transparent;position:relative}.ticket{background:var(--paper);border:1px solid #ded8cd;border-radius:8px;box-shadow:0 3px 14px #00000012;min-height:174px;display:grid;grid-template-columns:minmax(0,1fr) 70px;overflow:hidden;color:#272521}.ticketmain{padding:16px 16px 12px 19px;min-width:0}.ticketbrand{font-style:italic;font-size:25px;line-height:1.1;padding-bottom:9px;border-bottom:1px solid #e7e2d9;color:var(--ink)}.ticketmeta{display:flex;justify-content:space-between;gap:8px;color:#a59b8e;font-size:10px;letter-spacing:.16em;margin-top:-2px}.songtitle{font:bold 19px/1.2 Georgia,serif;margin-top:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#282622}.artist{font:14px/1.4 Georgia,serif;color:#81796f;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ticketseek{display:flex;align-items:center;gap:8px;color:#9d958b;font-size:10px;margin-top:12px}.ticketseek input{flex:1;min-width:0;accent-color:var(--accent);height:3px}.ticketcontrols{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:8px}.ticketcontrols button{background:transparent;border:0;color:#403e39;font-size:21px;padding:0 2px}.ticketcontrols .play{font-size:28px}.stub{border-left:2px dashed #e3ddd4;display:flex;flex-direction:column;align-items:center;justify-content:space-around;position:relative;padding:12px 4px}.stub:before,.stub:after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:transparent}.stub:before{top:-8px;box-shadow:0 0 0 20px transparent}.stub:after{bottom:-8px}.barcode{display:flex;gap:3px;height:34px;align-items:stretch}.barcode i{width:3px;background:var(--accent);opacity:.8}.stubword{writing-mode:vertical-rl;font-style:italic;font-size:18px;letter-spacing:.1em;color:var(--accent)}.stamp{font-size:10px;letter-spacing:.1em;border:1px dashed var(--accent);border-radius:50%;padding:8px 4px;color:var(--accent);transform:rotate(-12deg)}
/* Vinyl: the record is the whole widget; no card, track bar or text. */
.vinylstage{height:190px;width:100%;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;outline:none}.vinyl{width:min(178px,62vw);height:min(178px,62vw);max-width:178px;max-height:178px;border-radius:50%;position:relative;background:repeating-radial-gradient(circle at center,#151515 0 2px,#202020 3px 4px,#111 5px 6px,#242424 7px 8px);box-shadow:0 4px 10px #00000020,inset 0 0 0 1px #ffffff12;animation:spin 3.4s linear infinite;animation-play-state:paused}.vinyl:before{content:"";position:absolute;inset:35%;border-radius:50%;background:radial-gradient(circle at 48% 45%,#fff2b5 0 2px,#e4c96c 3px 56%,#b79b48 58% 62%,#e6ce78 64%);box-shadow:inset 0 0 0 1px #806c35}.vinyl:after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid #ffffff12}.arm{position:absolute;width:66px;height:7px;right:calc(50% - 104px);top:19px;transform:rotate(43deg);transform-origin:88% 50%;pointer-events:none}.arm:before{content:"";position:absolute;right:-3px;top:-5px;width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,#eee,#777,#f9f9f9);border:1px solid #aaa}.arm:after{content:"";position:absolute;left:0;top:2px;width:56px;height:3px;border-radius:5px;background:linear-gradient(#eee,#777,#fff);box-shadow:0 1px 2px #0002}.playing .vinyl{animation-play-state:running}.playing .arm{transform:rotate(53deg)}
/* Approved waveform artwork: cropped from the exact approved source image, with transparent background. */
.wavestage{min-height:78px;width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;outline:none;padding:0;background:transparent;border:0;overflow:hidden}
.waveart{display:block;width:min(100%,520px);height:140px;flex:0 1 520px;background:var(--wave-solid,#a995a8);-webkit-mask-image:var(--wave-mask);mask-image:var(--wave-mask);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;transform:scaleY(var(--wave-motion,1));transform-origin:center;will-change:transform;transition:transform .09s linear;background-color:var(--wave-solid,#a995a8)}

.compact{display:flex;align-items:center;gap:10px;padding:5px 0}.compact .dot{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,var(--label) 0 18%,#252321 20% 100%);border:0;flex-shrink:0;animation:spin 3s linear infinite;animation-play-state:paused}.compact.playing .dot{animation-play-state:running}.compact .ctext{min-width:0;flex:1}.compact .songtitle{font-size:14px;margin:0}.compact .artist{font-size:12px}.compact button{border:0;background:var(--soft);color:var(--ink);border-radius:50%;width:34px;height:34px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes wave{from{transform:scaleY(.35);opacity:.55}to{transform:scaleY(1);opacity:.95}}@media(prefers-reduced-motion:reduce){.vinyl,.wavebar,.compact .dot{animation:none!important}}
</style></head><body data-theme="cream"><div class="wrap"><main id="card" class="card"><section id="ticket" class="ticket" hidden><div class="ticketmain"><div class="ticketbrand" id="brand">Admit One</div><div class="ticketmeta"><span id="ticketartist">ORIGINAL SOUNDTRACK</span><span>N° 04</span></div><div class="songtitle" id="title">Song title</div><div class="artist" id="artist">Artist</div><div class="ticketseek"><span id="current">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="播放进度"><span id="duration">0:00</span></div><div class="ticketcontrols"><button id="loop" aria-label="单曲循环" title="单曲循环">↻</button><button id="prev" aria-label="上一首">|◀</button><button id="play" class="play" aria-label="播放或暂停">▷</button><button id="next" aria-label="下一首">▶|</button></div></div><aside class="stub"><div class="barcode"><i></i><i></i><i></i><i></i><i></i></div><div class="stubword">Memories</div><div class="stamp">ADMIT</div></aside></section><div id="vinylstage" class="vinylstage" role="button" tabindex="0" aria-label="点击播放或暂停" hidden><div class="vinyl"></div><div class="arm"></div></div><div id="wavestage" class="wavestage" role="button" tabindex="0" aria-label="点击播放或暂停" hidden><div id="waveArt" class="waveart" role="img" aria-label="透明动态声纹"></div></div><div id="compact" class="compact" hidden><button class="dot" id="dot" aria-label="播放或暂停"></button><div class="ctext"><div class="songtitle" id="ctitle"></div><div class="artist" id="cartist"></div></div><button id="cplay" aria-label="播放或暂停">▷</button></div></main></div><audio id="audio" preload="metadata"></audio>
<script>
(()=>{const $=id=>document.getElementById(id),audio=$('audio');let cfg={style:'ticket',theme:'cream',waveShape:'wave1',waveColor:'oat',mode:'single',loop:true,songs:[]},idx=0,loop=true,ac=null,analyser=null,source=null,raf=0,phase=0;
function decode(){try{let raw=new URLSearchParams(location.search).get('data');if(raw){raw=raw.replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';cfg=JSON.parse(decodeURIComponent(escape(atob(raw))))}}catch(e){}}
const fmt=n=>Number.isFinite(n)&&n>=0?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function current(){return cfg.songs[idx]||{title:'Song title',artist:'Artist'}}
const waveFiles={wave1:'assets/wave1-mask.png',wave2:'assets/wave2-mask.png',wave3:'assets/wave3-mask.png',wave4:'assets/wave4-mask.png'};
const waveColors={original:'#9c8d7d',oat:'#b8a18b',rose:'#c18f9a',sage:'#8f9b86',mistblue:'#8ba4ad',mauve:'#a092ad',apricot:'#c69a87',cocoa:'#987c6d',teal:'#789d99',olive:'#9a9b7d',lilac:'#b0a0b9',slate:'#8195a4',terracotta:'#bd8a78',plum:'#a27d91',sand:'#b8a58b',powderblue:'#9aaec1',dustycoral:'#c78e88',eucalyptus:'#819d8c',buttercream:'#c5b18a',smokylilac:'#9c91b1',moss:'#92977b',claypink:'#c49a9d',denim:'#7d91a8',peachbeige:'#c5a18b',mulberry:'#9d7e96',pistachio:'#a5ae8a'};
function setWaveArt(){const shape=waveFiles[cfg.waveShape]?cfg.waveShape:'wave1';const el=$('waveArt');el.style.setProperty('--wave-mask',`url("${waveFiles[shape]}")`);el.style.setProperty('--wave-solid',waveColors[cfg.waveColor]||waveColors.oat);el.setAttribute('aria-label','透明动态声纹 '+shape);}
function animateWave(){cancelAnimationFrame(raf);const tick=()=>{if(!$('wavestage').hidden&&!audio.paused){phase+=.045;let amp=.88+Math.abs(Math.sin(phase))*0.18;if(analyser){try{const data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];amp=.78+(sum/Math.max(1,data.length)/255)*.58}catch(e){}}$('waveArt').style.setProperty('--wave-motion',amp.toFixed(3));raf=requestAnimationFrame(tick)}else{$('waveArt').style.setProperty('--wave-motion','1');cancelAnimationFrame(raf)}};tick()}
function setupAnalyser(){if(analyser||!window.AudioContext&&!window.webkitAudioContext)return;try{const u=new URL(audio.currentSrc||audio.src,location.href);if(u.origin!==location.origin)return;const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();analyser=ac.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.82;source=ac.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ac.destination)}catch(e){analyser=null}}
function paint(){let s=current();$('title').textContent=s.title||'Song title';$('artist').textContent=s.artist||'';$('ticketartist').textContent=(s.artist||'ORIGINAL SOUNDTRACK').toUpperCase();$('ctitle').textContent=s.title||'Song title';$('cartist').textContent=s.artist||'';$('play').textContent=audio.paused?'▷':'Ⅱ';$('cplay').textContent=audio.paused?'▷':'Ⅱ';$('loop').style.color=loop?'var(--accent)':'#aaa';$('card').classList.toggle('playing',!audio.paused);if(!audio.paused){setupAnalyser();if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});animateWave()}else{cancelAnimationFrame(raf);$('waveArt').style.setProperty('--wave-motion','1')} $('ticket').hidden=cfg.style!=='ticket';$('vinylstage').hidden=cfg.style!=='vinyl';$('wavestage').hidden=cfg.style!=='wave';$('compact').hidden=cfg.style!=='compact';$('loop').textContent=loop?'↻':'↻';setWaveArt();}
function sync(){let d=audio.duration||0,c=audio.currentTime||0;$('seek').value=d?c/d*100:0;$('current').textContent=fmt(c);$('duration').textContent=fmt(d)}
function load(i,autoplay){if(!cfg.songs.length)return;idx=(i+cfg.songs.length)%cfg.songs.length;audio.src=cfg.songs[idx].url;audio.loop=loop;paint();if(autoplay)audio.play().catch(()=>{});sync()}
function toggle(){if(!cfg.songs.length)return;if(audio.paused)audio.play().catch(()=>{});else audio.pause()}
function activate(el){el.addEventListener('click',toggle);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})}
decode();loop=cfg.loop!==false;document.body.dataset.theme=['cream','rose','sage','lavender','night'].includes(cfg.theme)?cfg.theme:'cream';cfg.songs=(Array.isArray(cfg.songs)?cfg.songs:[]).filter(s=>s&&/^https?:/i.test(s.url||''));if(!['ticket','vinyl','wave','compact'].includes(cfg.style))cfg.style='ticket';if(!waveFiles[cfg.waveShape])cfg.waveShape='wave1';if(!waveColors[cfg.waveColor])cfg.waveColor='oat';if(cfg.mode!=='playlist')cfg.mode='single';activate($('vinylstage'));activate($('wavestage'));activate($('dot'));$('cplay').onclick=toggle;$('play').onclick=toggle;$('loop').onclick=()=>{loop=!loop;audio.loop=loop;paint()};$('seek').oninput=e=>{if(audio.duration)audio.currentTime=+e.target.value/100*audio.duration};$('prev').onclick=()=>load(idx-1,true);$('next').onclick=()=>load(idx+1,true);audio.addEventListener('play',paint);audio.addEventListener('pause',paint);audio.addEventListener('timeupdate',sync);audio.addEventListener('loadedmetadata',sync);audio.addEventListener('ended',()=>{if(loop){audio.currentTime=0;audio.play().catch(()=>{})}else if(idx<cfg.songs.length-1)load(idx+1,true)});paint();if(cfg.songs.length)load(0,false);
})();
</script></body></html>
