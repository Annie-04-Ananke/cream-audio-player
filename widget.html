<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cream Audio Player</title>
<style>
:root{--accent:#b9a083;--soft:#e6d9c8;--ink:#403b35;--muted:#9b9083;--paper:#fffdf8;--record:#191919;--label:#e8cf91;--wave:#c8ad91}

body[data-theme="sage"]{--accent:#87967e;--soft:#e0e7dc;--ink:#424b40;--paper:#fbfcf8;--label:#d0d9bd;--wave:#aebca4}

body[data-theme="bluegray"]{--accent:#879eaa;--soft:#e0e8eb;--ink:#3f4d53;--paper:#f8fbfc;--label:#c4d4db;--wave:#9bb3be}
body[data-theme="pistachio"]{--accent:#9cab88;--soft:#e7ecdE;--ink:#485142;--paper:#fbfcf6;--label:#ced9b9;--wave:#adbd9d}
body[data-theme="butter"]{--accent:#c9b27c;--soft:#f2ebd6;--ink:#5a503a;--paper:#fffdf4;--label:#e5d49c;--wave:#d7c28c}
body[data-theme="mauve"]{--accent:#a898aa;--soft:#eae3eb;--ink:#514653;--paper:#fcf9fc;--label:#d2c4d5;--wave:#b9a8bd}
body[data-theme="terracotta"]{--accent:#bd8c7b;--soft:#f0e0d8;--ink:#5a443e;--paper:#fff9f5;--label:#dfb9a8;--wave:#c99c8b}
body[data-theme="mist"]{--accent:#8eaaa8;--soft:#e0ece9;--ink:#405452;--paper:#f8fcfb;--label:#bfd6d1;--wave:#9fbbb5}
body[data-theme="cocoa"]{--accent:#a77e83;--soft:#e8d9d8;--ink:#503d40;--paper:#fbf5f3;--label:#d3b0b0;--wave:#b88e92}
body[data-theme="ivory"]{--accent:#b6a28a;--soft:#eee6d9;--ink:#51483e;--paper:#fffdf7;--label:#dfd0b8;--wave:#c5b39a}
body[data-theme="dustyblue"]{--accent:#7f9aa8;--soft:#e0e8ed;--ink:#3f4d56;--paper:#f8fbfd;--label:#c5d6df;--wave:#9bb3c0}
body[data-theme="peach"]{--accent:#c9937f;--soft:#f3e1d8;--ink:#5a443e;--paper:#fff9f5;--label:#e8c5b4;--wave:#d5aa96}
body[data-theme="mintcream"]{--accent:#8ca99b;--soft:#e3ede6;--ink:#40534a;--paper:#fbfdf9;--label:#c9ddcf;--wave:#a7c2b2}

*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;padding:0;background:transparent!important;font:14px/1.45 Georgia,'Times New Roman',serif;color:var(--ink)}button{font:inherit;cursor:pointer}.wrap{width:100%;margin:0 auto;padding:0;background:transparent}.card{width:100%;background:transparent;position:relative}.ticket{background:var(--paper);border:1px solid #ded8cd;border-radius:8px;box-shadow:0 3px 14px #00000012;min-height:174px;display:grid;grid-template-columns:minmax(0,1fr) 70px;overflow:hidden;color:#272521}
/* Three additional ticket templates recreated from the user's supplied reference image. */
.ticket.template-opera{background:#111013;border:1px solid #302b30;border-radius:12px;color:#e7e0dc;grid-template-columns:minmax(0,1fr) 70px;box-shadow:none}
.ticket.template-opera .ticketmain{background:linear-gradient(115deg,#1a090a 0%,#100f12 78%)}
.ticket.template-opera .ticketbrand{font-family:"Brush Script MT","Segoe Script",cursive;font-size:27px;color:#c7a33f;border-bottom-color:#32282a}
.ticket.template-opera .ticketmeta{color:#655e61}
.ticket.template-opera .songtitle{color:#f0e9e6}
.ticket.template-opera .artist{color:#aaa0a1}
.ticket.template-opera .ticketseek{color:#817a7b}
.ticket.template-opera .ticketseek input{accent-color:#d7b536}
.ticket.template-opera .ticketcontrols button{color:#ded8d6}
.ticket.template-opera .stub{border-left-color:#393439;background:#121114}
.ticket.template-opera .barcode i{background:#a98c2e}
.ticket.template-opera .stubword{color:#a92327}
.ticket.template-opera .stamp{border:2px solid #776022;border-radius:5px;color:#b9a13d;font-style:italic;transform:rotate(12deg);font-size:13px;padding:8px 4px}
.ticket.template-faust{background:#262925;border:1px solid #30342d;border-radius:4px;color:#d4d6c5;grid-template-columns:minmax(0,1fr) 70px;box-shadow:none}
.ticket.template-faust .ticketmain{background:linear-gradient(115deg,#252925,#20231f)}
.ticket.template-faust .ticketbrand{font-family:"Brush Script MT","Segoe Script",cursive;font-size:27px;color:#a8b69a;border-bottom-color:#3c4038}
.ticket.template-faust .ticketmeta{color:#5e6259}
.ticket.template-faust .songtitle{color:#e5e4d9}
.ticket.template-faust .artist{color:#aaa99f}
.ticket.template-faust .ticketseek{color:#85887b}
.ticket.template-faust .ticketseek input{accent-color:#a9b99b}
.ticket.template-faust .ticketcontrols button{color:#c5c9b7}
.ticket.template-faust .stub{border-left-color:#3b4038;background:#22251f}
.ticket.template-faust .barcode i{background:#7d8877}
.ticket.template-faust .stubword{color:#aab99c}
.ticket.template-faust .stamp{border:1px solid #77816c;color:#aebba0;background:#292d26;clip-path:polygon(15% 0,85% 5%,100% 35%,88% 100%,12% 94%,0 30%);border-radius:0;transform:rotate(-10deg);font-size:9px;padding:9px 5px}
.ticket.template-redblack{background:#fff;border:1px solid #e2e0dd;border-left:8px solid #9e111b;border-radius:0;color:#161616;grid-template-columns:minmax(0,1fr) 70px;box-shadow:none}
.ticket.template-redblack .ticketmain{background:#fff;padding-top:17px}
.ticket.template-redblack .ticketbrand{font-family:"Brush Script MT","Segoe Script",cursive;font-size:28px;color:#171717;border-bottom:3px solid #191919;padding-bottom:10px}
.ticket.template-redblack .ticketmeta{color:#222;font-weight:bold}
.ticket.template-redblack .songtitle{color:#111}
.ticket.template-redblack .artist{color:#666}
.ticket.template-redblack .ticketseek{color:#171717;font-weight:bold}
.ticket.template-redblack .ticketseek input{accent-color:#97121b}
.ticket.template-redblack .ticketcontrols button{color:#111}
.ticket.template-redblack .stub{border-left:0;background:#111;}
.ticket.template-redblack .barcode i{background:#fff}
.ticket.template-redblack .stubword{color:#fff}
.ticket.template-redblack .stamp{border:2px solid #9d111a;color:#9d111a;border-radius:50%;font-size:11px;font-weight:bold;padding:10px 3px;transform:rotate(-12deg);background:#fff}

.ticketmain{padding:16px 16px 12px 19px;min-width:0}.ticketbrand{font-style:italic;font-size:25px;line-height:1.1;padding-bottom:9px;border-bottom:1px solid #e7e2d9;color:var(--ink)}.ticketmeta{display:flex;justify-content:space-between;gap:8px;color:#a59b8e;font-size:10px;letter-spacing:.16em;margin-top:-2px}.songtitle{font:bold 19px/1.2 Georgia,serif;margin-top:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#282622}.artist{font:14px/1.4 Georgia,serif;color:#81796f;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ticketseek{display:flex;align-items:center;gap:8px;color:#9d958b;font-size:10px;margin-top:12px}.ticketseek input{flex:1;min-width:0;accent-color:var(--accent);height:3px}.ticketcontrols{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:8px}.ticketcontrols button{background:transparent;border:0;color:#403e39;font-size:21px;padding:0 2px}.ticketcontrols .play{font-size:28px}.stub{border-left:2px dashed #e3ddd4;display:flex;flex-direction:column;align-items:center;justify-content:space-around;position:relative;padding:12px 4px}.stub:before,.stub:after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:transparent}.stub:before{top:-8px;box-shadow:0 0 0 20px transparent}.stub:after{bottom:-8px}.barcode{display:flex;gap:3px;height:34px;align-items:stretch}.barcode i{width:3px;background:var(--accent);opacity:.8}.stubword{writing-mode:vertical-rl;font-style:italic;font-size:18px;letter-spacing:.1em;color:var(--accent)}.stamp{font-size:10px;letter-spacing:.1em;border:1px dashed var(--accent);border-radius:50%;padding:8px 4px;color:var(--accent);transform:rotate(-12deg)}
/* Vinyl: the record is the whole widget; no card, track bar or text. */
.vinylstage{height:190px;width:100%;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;outline:none}.vinyl{width:min(178px,62vw);height:min(178px,62vw);max-width:178px;max-height:178px;border-radius:50%;position:relative;background:repeating-radial-gradient(circle at center,#151515 0 2px,#202020 3px 4px,#111 5px 6px,#242424 7px 8px);box-shadow:0 4px 10px #00000020,inset 0 0 0 1px #ffffff12;animation:spin 3.4s linear infinite;animation-play-state:paused}.vinyl:before{content:"";position:absolute;inset:35%;border-radius:50%;background:radial-gradient(circle at 48% 45%,#fff2b5 0 2px,#e4c96c 3px 56%,#b79b48 58% 62%,#e6ce78 64%);box-shadow:inset 0 0 0 1px #806c35}.vinyl:after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid #ffffff12}.arm{position:absolute;width:66px;height:7px;right:calc(50% - 104px);top:19px;transform:rotate(43deg);transform-origin:88% 50%;pointer-events:none}.arm:before{content:"";position:absolute;right:-3px;top:-5px;width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,#eee,#777,#f9f9f9);border:1px solid #aaa}.arm:after{content:"";position:absolute;left:0;top:2px;width:56px;height:3px;border-radius:5px;background:linear-gradient(#eee,#777,#fff);box-shadow:0 1px 2px #0002}.playing .vinyl{animation-play-state:running}.playing .arm{transform:rotate(25deg)}
#vinylstage:not(.playing) .arm{transform:rotate(53deg)}
#vinylstage.playing .arm{transform:rotate(25deg)}
/* Gentle mechanical motion: cassette reels and both record types move only while audio is playing. */
.cassette-reel{position:relative;animation:cassetteSpin 1.6s linear infinite;animation-play-state:paused}
.cassette-reel:before{content:"";position:absolute;inset:7px;border:2px dashed #eee;border-radius:50%}
.cassette-reel:after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);border-radius:50%;background:#333;box-shadow:0 -10px 0 -1px #f5f5f5,8px 5px 0 -1px #f5f5f5,-8px 5px 0 -1px #f5f5f5}
.playing .cassette-reel{animation-play-state:running}
.turntable-disc{cursor:pointer;animation-play-state:paused;transition:filter .25s}
.turntable-arm{cursor:grab;touch-action:none;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.turntable-arm:active{cursor:grabbing}
.turntable.playing .turntable-arm{transform:rotate(18deg)}
.turntable:not(.playing) .turntable-arm{transform:rotate(54deg)}
.turntable-disc{animation:spin 5.5s linear infinite;animation-play-state:paused}
.turntable.playing .turntable-disc{animation-play-state:running}
.arm{cursor:grab;pointer-events:auto;touch-action:none;transition:transform .35s ease}
.arm:active{cursor:grabbing}
@keyframes cassetteSpin{to{transform:rotate(360deg)}}
/* Compact transparent audio-reactive waveform, matching the approved reference. */
.wavestage{height:130px;min-height:130px;width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;outline:none;padding:0;overflow:hidden;background:transparent}
.wave-art{display:block;width:min(560px,100%);max-width:100%;height:100px;overflow:hidden;filter:none;flex:0 1 560px;background:transparent}


/* Four new image-guided styles: album sleeve, torn-paper strip, cassette, turntable. */
.extra-stage{width:100%;position:relative;color:var(--x-ink);--x-paper:#f7f5ef;--x-ink:#272522;--x-accent:#b8afa1;--x-edge:#d9d5ce;--x-chassis:#292a2b;--x-chassis2:#101112;--x-script:#786e61}
body[data-theme="rose"] .extra-stage{--x-paper:#f8eeee;--x-ink:#4e3b3e;--x-accent:#bd8e91;--x-edge:#ddc7c8;--x-chassis:#584548;--x-chassis2:#302629;--x-script:#a86f7c}
body[data-theme="sage"] .extra-stage{--x-paper:#edf0e9;--x-ink:#39453c;--x-accent:#87967e;--x-edge:#c9d1c4;--x-chassis:#424b40;--x-chassis2:#252d27;--x-script:#87967e}
body[data-theme="lavender"] .extra-stage{--x-paper:#f1edf5;--x-ink:#4c4654;--x-accent:#a79ab9;--x-edge:#d4ccdd;--x-chassis:#514a5c;--x-chassis2:#2b2633;--x-script:#a79ab9}
body[data-theme="night"] .extra-stage{--x-paper:#282522;--x-ink:#eee5da;--x-accent:#c6a878;--x-edge:#4b4239;--x-chassis:#3a332e;--x-chassis2:#211e1b;--x-script:#c6a878}
body[data-theme="powder"] .extra-stage{--x-paper:#f8eeee;--x-ink:#58464d;--x-accent:#c69ba9;--x-edge:#e3cdd5;--x-chassis:#59454d;--x-chassis2:#30262a;--x-script:#b27f90}
body[data-theme="bluegray"] .extra-stage{--x-paper:#edf3f5;--x-ink:#3f4d53;--x-accent:#879eaa;--x-edge:#cbd9df;--x-chassis:#43525a;--x-chassis2:#262e33;--x-script:#7f9ba7}
body[data-theme="pistachio"] .extra-stage{--x-paper:#f0f2e8;--x-ink:#485142;--x-accent:#9cab88;--x-edge:#d3dcc8;--x-chassis:#4a5443;--x-chassis2:#293027;--x-script:#8c9d79}
body[data-theme="butter"] .extra-stage{--x-paper:#fbf5df;--x-ink:#5a503a;--x-accent:#c9b27c;--x-edge:#e8ddb7;--x-chassis:#5a503a;--x-chassis2:#302a20;--x-script:#ad965d}
body[data-theme="mauve"] .extra-stage{--x-paper:#f1ebf2;--x-ink:#514653;--x-accent:#a898aa;--x-edge:#d8cbdc;--x-chassis:#514653;--x-chassis2:#2b252d;--x-script:#95819b}
body[data-theme="terracotta"] .extra-stage{--x-paper:#f6e9e1;--x-ink:#5a443e;--x-accent:#bd8c7b;--x-edge:#e3c9bc;--x-chassis:#5a443e;--x-chassis2:#30231f;--x-script:#a97464}
body[data-theme="mist"] .extra-stage{--x-paper:#eaf3f1;--x-ink:#405452;--x-accent:#8eaaa8;--x-edge:#c8dcd8;--x-chassis:#405452;--x-chassis2:#232f2d;--x-script:#729591}
body[data-theme="cocoa"] .extra-stage{--x-paper:#f0e3e0;--x-ink:#503d40;--x-accent:#a77e83;--x-edge:#ddc5c4;--x-chassis:#503d40;--x-chassis2:#2a2022;--x-script:#93666c}
body[data-theme="ivory"] .extra-stage{--x-paper:#f7f1e6;--x-ink:#51483e;--x-accent:#b6a28a;--x-edge:#ded2c0;--x-chassis:#51483e;--x-chassis2:#29241f;--x-script:#a28b6e}
body[data-theme="dustyblue"] .extra-stage{--x-paper:#edf3f6;--x-ink:#3f4d56;--x-accent:#7f9aa8;--x-edge:#cbd9df;--x-chassis:#3f4d56;--x-chassis2:#232c32;--x-script:#7894a3}
body[data-theme="peach"] .extra-stage{--x-paper:#f8ece5;--x-ink:#5a443e;--x-accent:#c9937f;--x-edge:#e7cfc2;--x-chassis:#5a443e;--x-chassis2:#30231f;--x-script:#b77d68}
body[data-theme="mintcream"] .extra-stage{--x-paper:#edf5ee;--x-ink:#40534a;--x-accent:#8ca99b;--x-edge:#cfe0d3;--x-chassis:#40534a;--x-chassis2:#24302a;--x-script:#78998a}

.extra-stage[hidden]{display:none!important}
.sleeve-stage{height:280px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.sleeve{position:relative;width:min(78%,230px);height:250px;background:var(--x-paper);border:1px solid var(--x-edge);box-shadow:0 3px 9px #0002;z-index:2;padding:22px 20px 18px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--x-ink)}
.sleeve:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff38,transparent 48%);pointer-events:none}
.aniseol-script{font-family:"Apple Chancery","URW Chancery L","Snell Roundhand","Brush Script MT","Segoe Script",cursive;font-style:italic;font-weight:500;letter-spacing:.01em;color:var(--x-script);line-height:1.1}
.sleeve .aniseol-script{position:absolute;top:22px;left:20px;font-size:25px;z-index:1}
.torn-aniseol{font-size:22px;text-align:center;margin:-7px 0 8px;color:var(--x-script)}
.cassette-head .aniseol-script{font-size:22px;white-space:nowrap}
.turntable-aniseol{position:absolute;left:8%;top:70%;font-size:24px;color:var(--x-script);z-index:3;transform:rotate(-3deg);text-shadow:0 1px 0 #0003}
.sleeve .sleeve-label{font:italic 11px Georgia,serif;opacity:.72;margin-bottom:7px}
.sleeve .sleeve-lines{height:2px;background:var(--x-accent);opacity:.5;margin:4px 0;width:78%}
.sleeve .sleeve-lines.short{width:52%}
.sleeve-disc{position:absolute;width:min(68%,205px);height:min(68vw,205px);max-height:205px;max-width:205px;min-width:155px;min-height:155px;border-radius:50%;left:48%;top:50%;transform:translateY(-50%);background:repeating-radial-gradient(circle,#080808 0 2px,#151515 3px 4px,#090909 5px 6px,#202020 7px 8px);box-shadow:0 2px 7px #0003}
.sleeve-disc:before{content:"";position:absolute;inset:37%;border-radius:50%;background:var(--x-paper);border:1px solid var(--x-edge)}
.sleeve-disc:after{content:"";position:absolute;left:49%;top:49%;width:5px;height:5px;border-radius:50%;background:var(--x-accent)}
.torn-stage{min-height:220px;padding:36px 0;display:flex;align-items:center;justify-content:center}
.torn-panel{position:relative;width:100%;padding:25px 9% 20px;background:var(--x-paper);color:var(--x-ink);filter:drop-shadow(0 2px 1px #00000008);clip-path:polygon(0 4%,3% 1%,7% 3%,11% 0,16% 2%,22% 1%,28% 3%,34% 0,40% 2%,47% 1%,53% 3%,60% 0,67% 2%,73% 1%,80% 3%,87% 0,93% 2%,100% 1%,100% 96%,96% 98%,91% 96%,85% 100%,79% 97%,72% 99%,66% 96%,60% 100%,53% 97%,46% 99%,39% 96%,33% 100%,27% 97%,20% 99%,14% 96%,8% 100%,3% 97%,0 99%)}
.torn-top{display:flex;justify-content:space-between;align-items:center;font-size:22px;margin-bottom:12px}
.torn-seek{display:flex;gap:8px;align-items:center;font: bold 12px Arial,sans-serif;margin:10px 0 18px}
.torn-seek input{flex:1;min-width:0;accent-color:var(--x-accent);height:3px}
.torn-controls{display:flex;align-items:center;justify-content:space-around;gap:8px}
.torn-controls button{border:0;background:transparent;color:var(--x-ink);font-size:22px;padding:2px}
.torn-controls .xplay{width:66px;height:66px;border:1px solid var(--x-ink);border-radius:50%;font-size:27px}
.cassette-stage{min-height:240px;display:flex;align-items:center;justify-content:center;padding:12px}
.cassette{position:relative;width:min(100%,390px);aspect-ratio:1.42;background:linear-gradient(145deg,var(--x-paper),var(--x-edge));border:2px solid var(--x-edge);border-radius:16px;box-shadow:0 3px 8px #0002,inset 0 0 0 5px #ffffff45;padding:22px 24px 20px;color:var(--x-ink)}
.cassette:before{content:"";position:absolute;inset:9px;border:1px solid var(--x-edge);border-radius:10px;pointer-events:none}
.cassette-head{display:flex;align-items:center;gap:10px;font:italic 20px "Brush Script MT","Segoe Script",cursive;border-bottom:1px solid var(--x-edge);padding-bottom:7px;position:relative}
.cassette-a{font:bold 18px Arial,sans-serif;border:2px solid var(--x-ink);padding:1px 5px;font-style:normal}
.cassette-window{height:65px;background:#111;border-radius:8px;margin:12px auto 7px;width:72%;display:flex;align-items:center;justify-content:space-around;box-shadow:inset 0 0 0 2px #777}
.cassette-reel{width:40px;height:40px;border-radius:50%;background:repeating-radial-gradient(circle,#e5e5e5 0 2px,#777 3px 5px,#c8c8c8 6px 7px);border:4px solid var(--x-accent);box-shadow:inset 0 0 0 2px var(--x-edge)}
.cassette-tape{width:42px;height:36px;background:linear-gradient(90deg,#181818,#555,#171717);border:1px solid #777}
.cassette-type{text-align:center;font:8px Arial,sans-serif;letter-spacing:.06em;margin-top:4px}
.cassette-foot{position:absolute;bottom:13px;left:15%;right:15%;height:17px;border-top:2px solid var(--x-edge);display:flex;justify-content:space-around;align-items:center}
.cassette-foot i{width:11px;height:11px;border-radius:50%;background:#333}
.cassette-controls{position:absolute;left:12%;right:12%;bottom:34px;z-index:2;display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,18px);margin:0}
.cassette-controls button{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:26px;padding:0 3px;border:0;background:transparent;color:var(--x-ink);font-size:17px;line-height:1;cursor:pointer}
.cassette-controls .cassette-play{width:31px;height:31px;min-width:31px;border:1.5px solid var(--x-ink);border-radius:50%;font-size:16px}

.turntable-stage{min-height:280px;display:flex;align-items:center;justify-content:center;padding:14px}
