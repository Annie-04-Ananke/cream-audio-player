<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cream Audio Player</title>
<style>
:root{--accent:#b9a083;--soft:#e6d9c8;--ink:#403b35;--muted:#9b9083;--paper:#fffdf8;--record:#191919;--label:#e8cf91;--wave:#c8ad91}
body[data-theme="rose"]{--accent:#bd8e91;--soft:#f0dedd;--ink:#594442;--paper:#fff9f7;--label:#e8c4c2;--wave:#d7aaa9}
body[data-theme="sage"]{--accent:#87967e;--soft:#e0e7dc;--ink:#424b40;--paper:#fbfcf8;--label:#d0d9bd;--wave:#aebca4}
body[data-theme="lavender"]{--accent:#a79ab9;--soft:#e8e2ef;--ink:#514a5c;--paper:#fcfaff;--label:#d9cde8;--wave:#c0b2d1}
body[data-theme="night"]{--accent:#c6a878;--soft:#3a332e;--ink:#eee4d7;--paper:#211e1b;--label:#e1c66b;--wave:#b9a18a}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;padding:0;background:transparent!important;font:14px/1.45 Georgia,'Times New Roman',serif;color:var(--ink)}button{font:inherit;cursor:pointer}.wrap{width:100%;margin:0 auto;padding:0;background:transparent}.card{width:100%;background:transparent;position:relative}.ticket{background:var(--paper);border:1px solid #ded8cd;border-radius:8px;box-shadow:0 3px 14px #00000012;min-height:174px;display:grid;grid-template-columns:minmax(0,1fr) 70px;overflow:hidden;color:#272521}.ticketmain{padding:16px 16px 12px 19px;min-width:0}.ticketbrand{font-style:italic;font-size:25px;line-height:1.1;padding-bottom:9px;border-bottom:1px solid #e7e2d9;color:var(--ink)}.ticketmeta{display:flex;justify-content:space-between;gap:8px;color:#a59b8e;font-size:10px;letter-spacing:.16em;margin-top:-2px}.songtitle{font:bold 19px/1.2 Georgia,serif;margin-top:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#282622}.artist{font:14px/1.4 Georgia,serif;color:#81796f;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ticketseek{display:flex;align-items:center;gap:8px;color:#9d958b;font-size:10px;margin-top:12px}.ticketseek input{flex:1;min-width:0;accent-color:var(--accent);height:3px}.ticketcontrols{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:8px}.ticketcontrols button{background:transparent;border:0;color:#403e39;font-size:21px;padding:0 2px}.ticketcontrols .play{font-size:28px}.stub{border-left:2px dashed #e3ddd4;display:flex;flex-direction:column;align-items:center;justify-content:space-around;position:relative;padding:12px 4px}.stub:before,.stub:after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:transparent}.stub:before{top:-8px;box-shadow:0 0 0 20px transparent}.stub:after{bottom:-8px}.barcode{display:flex;gap:3px;height:34px;align-items:stretch}.barcode i{width:3px;background:var(--accent);opacity:.8}.stubword{writing-mode:vertical-rl;font-style:italic;font-size:18px;letter-spacing:.1em;color:var(--accent)}.stamp{font-size:10px;letter-spacing:.1em;border:1px dashed var(--accent);border-radius:50%;padding:8px 4px;color:var(--accent);transform:rotate(-12deg)}
/* Vinyl: the record is the whole widget; no card, track bar or text. */
.vinylstage{height:190px;width:100%;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;outline:none}.vinyl{width:min(178px,62vw);height:min(178px,62vw);max-width:178px;max-height:178px;border-radius:50%;position:relative;background:repeating-radial-gradient(circle at center,#151515 0 2px,#202020 3px 4px,#111 5px 6px,#242424 7px 8px);box-shadow:0 4px 10px #00000020,inset 0 0 0 1px #ffffff12;animation:spin 3.4s linear infinite;animation-play-state:paused}.vinyl:before{content:"";position:absolute;inset:35%;border-radius:50%;background:radial-gradient(circle at 48% 45%,#fff2b5 0 2px,#e4c96c 3px 56%,#b79b48 58% 62%,#e6ce78 64%);box-shadow:inset 0 0 0 1px #806c35}.vinyl:after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid #ffffff12}.arm{position:absolute;width:66px;height:7px;right:calc(50% - 104px);top:19px;transform:rotate(43deg);transform-origin:88% 50%;pointer-events:none}.arm:before{content:"";position:absolute;right:-3px;top:-5px;width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,#eee,#777,#f9f9f9);border:1px solid #aaa}.arm:after{content:"";position:absolute;left:0;top:2px;width:56px;height:3px;border-radius:5px;background:linear-gradient(#eee,#777,#fff);box-shadow:0 1px 2px #0002}.playing .vinyl{animation-play-state:running}.playing .arm{transform:rotate(53deg)}
/* Compact transparent audio-reactive waveform, matching the approved reference. */
.wavestage{height:92px;min-height:92px;width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;outline:none;padding:2px 4px;overflow:hidden}
.wave-art{display:block;width:100%;max-width:340px;height:88px;overflow:visible}

.compact{display:flex;align-items:center;gap:10px;padding:5px 0}.compact .dot{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,var(--label) 0 18%,#252321 20% 100%);border:0;flex-shrink:0;animation:spin 3s linear infinite;animation-play-state:paused}.compact.playing .dot{animation-play-state:running}.compact .ctext{min-width:0;flex:1}.compact .songtitle{font-size:14px;margin:0}.compact .artist{font-size:12px}.compact button{border:0;background:var(--soft);color:var(--ink);border-radius:50%;width:34px;height:34px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes wave{from{transform:scaleY(.35);opacity:.55}to{transform:scaleY(1);opacity:.95}}@media(prefers-reduced-motion:reduce){.vinyl,.wavebar,.compact .dot{animation:none!important}}
</style></head><body data-theme="cream"><div class="wrap"><main id="card" class="card"><section id="ticket" class="ticket" hidden><div class="ticketmain"><div class="ticketbrand" id="brand">Admit One</div><div class="ticketmeta"><span id="ticketartist">ORIGINAL SOUNDTRACK</span><span>N° 04</span></div><div class="songtitle" id="title">Song title</div><div class="artist" id="artist">Artist</div><div class="ticketseek"><span id="current">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="播放进度"><span id="duration">0:00</span></div><div class="ticketcontrols"><button id="loop" aria-label="单曲循环" title="单曲循环">↻</button><button id="prev" aria-label="上一首">|◀</button><button id="play" class="play" aria-label="播放或暂停">▷</button><button id="next" aria-label="下一首">▶|</button></div></div><aside class="stub"><div class="barcode"><i></i><i></i><i></i><i></i><i></i></div><div class="stubword">Memories</div><div class="stamp">ADMIT</div></aside></section><div id="vinylstage" class="vinylstage" role="button" tabindex="0" aria-label="点击播放或暂停" hidden><div class="vinyl"></div><div class="arm"></div></div><div id="wavestage" class="wavestage" role="button" tabindex="0" aria-label="点击播放或暂停" hidden><canvas id="waveCanvas" class="wave-art" width="360" height="112" aria-label="动态音乐声纹"></canvas></div><div id="compact" class="compact" hidden><button class="dot" id="dot" aria-label="播放或暂停"></button><div class="ctext"><div class="songtitle" id="ctitle"></div><div class="artist" id="cartist"></div></div><button id="cplay" aria-label="播放或暂停">▷</button></div></main></div><audio id="audio" preload="metadata"></audio>
<script>
(()=>{
 const $=id=>document.getElementById(id),audio=$('audio'),canvas=$('waveCanvas'),ctx=canvas.getContext('2d');
 let cfg={style:'ticket',theme:'cream',waveShape:'wave1',waveColor:'champagne',mode:'single',loop:true,songs:[]},idx=0,loop=true,ac=null,analyser=null,source=null,playing=false,raf=0,phase=0;
 const palettes={champagne:['#4b3928','#c8ad91','#f5e5c9'],rose:['#6b3548','#e8a9b7','#ffe1e7'],lavender:['#4b3674','#b7a4ff','#eee6ff'],ice:['#153d70','#63cfff','#d9f7ff'],mint:['#164e45','#67e6b5','#d9fff0'],sunset:['#762f1d','#ff8a54','#ffe0a1'],neon:['#ff2fcf','#43f5ff','#fff56d'],ocean:['#123d63','#247bff','#73f5ff'],forest:['#193b2b','#5dba77','#d8ffd5'],monochrome:['#222222','#aaaaaa','#ffffff'],berry:['#651f51','#e75aa7','#ffc7e9'],gold:['#68451a','#f4c95d','#fff0b0']};
 function decode(){try{let raw=new URLSearchParams(location.search).get('data');if(raw){raw=raw.replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';cfg=JSON.parse(decodeURIComponent(escape(atob(raw))))}}catch(e){}}
 const fmt=n=>Number.isFinite(n)&&n>=0?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
 function current(){return cfg.songs[idx]||{title:'Song title',artist:'Artist'}}
 function palette(){return palettes[cfg.waveColor]||palettes.champagne}
 function paint(){let s=current();$('title').textContent=s.title||'Song title';$('artist').textContent=s.artist||'';$('ticketartist').textContent=(s.artist||'ORIGINAL SOUNDTRACK').toUpperCase();$('ctitle').textContent=s.title||'Song title';$('cartist').textContent=s.artist||'';$('play').textContent=audio.paused?'▷':'Ⅱ';$('cplay').textContent=audio.paused?'▷':'Ⅱ';$('loop').style.color=loop?'var(--accent)':'#aaa';$('card').classList.toggle('playing',!audio.paused);$('ticket').hidden=cfg.style!=='ticket';$('vinylstage').hidden=cfg.style!=='vinyl';$('wavestage').hidden=!String(cfg.style).startsWith('wave');$('compact').hidden=cfg.style!=='compact';$('loop').textContent='↻';drawWave()}
 function sync(){let d=audio.duration||0,c=audio.currentTime||0;$('seek').value=d?c/d*100:0;$('current').textContent=fmt(c);$('duration').textContent=fmt(d)}
 function setupAnalyser(){if(analyser||(!window.AudioContext&&!window.webkitAudioContext))return;try{const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();analyser=ac.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.78;source=ac.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ac.destination)}catch(e){analyser=null}}
 async function load(i,autoplay){if(!cfg.songs.length)return;idx=(i+cfg.songs.length)%cfg.songs.length;audio.crossOrigin='anonymous';audio.src=cfg.songs[idx].url;audio.loop=loop;paint();if(autoplay)await playAudio();sync()}
 async function playAudio(){if(!cfg.songs.length)return;setupAnalyser();if(ac&&ac.state==='suspended')try{await ac.resume()}catch(e){}try{await audio.play()}catch(e){}}
 function toggle(){if(!cfg.songs.length)return;if(audio.paused)playAudio();else audio.pause()}
 function activate(el){el.addEventListener('click',toggle);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})}
 function drawWave(){if(!ctx||canvas.hidden)return;const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);const [dark,main,glow]=palette();let data=new Uint8Array(analyser?analyser.frequencyBinCount:64);if(analyser&&playing){analyser.getByteFrequencyData(data);let peak=0;for(let i=0;i<data.length;i++)if(data[i]>peak)peak=data[i];if(peak<3)for(let i=0;i<data.length;i++)data[i]=18+Math.abs(Math.sin(phase+i*.33))*76}else for(let i=0;i<data.length;i++)data[i]=playing?(26+Math.abs(Math.sin(phase+i*.33))*90):8;
 ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<13;i++){const x=12+(i/12)*(w-24),y=h/2+(Math.sin(phase*.8+i*1.7)*1.5);ctx.fillStyle=glow;ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(x,y,1.1+(i%3)*.25,0,Math.PI*2);ctx.fill()}ctx.restore();
 const shape=String(cfg.waveShape||'wave1');
 ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=main;ctx.fillStyle=main;ctx.shadowColor=glow;ctx.shadowBlur=playing?10:5;ctx.lineWidth=shape==='wave1'?1.7:1.35;
 if(shape==='wave1'){ctx.beginPath();for(let i=0;i<96;i++){let x=8+i*(w-16)/95;let v=data[Math.min(data.length-1,Math.floor(i/96*data.length))]||0;let y=h/2+Math.sin(i*2.25+phase*.55)*(playing?(3+v/255*35):1.2);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.strokeStyle=dark;ctx.globalAlpha=.52;ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(8,h/2);ctx.lineTo(w-8,h/2);ctx.stroke()}
 else if(shape==='wave2'){const n=48,gap=2,bw=(w-24)/n;for(let i=0;i<n;i++){let v=data[Math.min(data.length-1,Math.floor(i/n*data.length))]||0;let hh=playing?3+v/255*39:2.5;let x=12+i*bw;ctx.globalAlpha=.55+v/600;ctx.beginPath();ctx.roundRect(x,h/2-hh/2,Math.max(1,bw-gap),hh,Math.min(3,bw/2));ctx.fill()}ctx.globalAlpha=1}
 else if(shape==='wave3'){ctx.beginPath();for(let i=0;i<=160;i++){let x=8+i*(w-16)/160;let v=data[Math.min(data.length-1,Math.floor(i/160*data.length))]||0;let envelope=playing?(.25+v/255*.75):.04;let y=h/2+Math.sin(i/160*Math.PI*8+phase*.45)*(3+envelope*30);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()}
 else {const n=38,gap=2,bw=(w-24)/n;for(let i=0;i<n;i++){let v=data[Math.min(data.length-1,Math.floor(i/n*data.length))]||0;let hh=playing?4+v/255*40:2.5;ctx.globalAlpha=.7+v/900;ctx.fillRect(12+i*bw,h/2-hh/2,Math.max(1,bw-gap),hh)}ctx.globalAlpha=1}
 ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.fillStyle=glow;const sparks=[[28,20],[w-33,25],[w*.28, h-18],[w*.73,h-16],[w*.52,13]];sparks.forEach((p,i)=>{let a=.4+Math.abs(Math.sin(phase*.7+i*1.4))*.6;ctx.globalAlpha=a;ctx.beginPath();ctx.arc(p[0],p[1],1.1,0,Math.PI*2);ctx.fill();if(i===0||i===4){ctx.fillRect(p[0]-3,p[1]-.35,6,.7);ctx.fillRect(p[0]-.35,p[1]-3,.7,6)}});ctx.globalAlpha=1;ctx.shadowBlur=0;
 }
 function animate(){if(!playing){raf=0;drawWave();return}phase+=.13;drawWave();raf=requestAnimationFrame(animate)}
 decode();loop=cfg.loop!==false;document.body.dataset.theme=['cream','rose','sage','lavender','night'].includes(cfg.theme)?cfg.theme:'cream';cfg.songs=(Array.isArray(cfg.songs)?cfg.songs:[]).filter(s=>s&&/^https?:/i.test(s.url||''));const styleAliases={cream:'compact',minimal:'compact',simple:'compact',ticket:'ticket',vinyl:'vinyl',wave:'wave1',waveform:'wave1',wave1:'wave1',wave2:'wave2',wave3:'wave3',wave4:'wave4',compact:'compact'};cfg.style=styleAliases[cfg.style]||'ticket';cfg.waveShape=cfg.waveShape|| (cfg.style.startsWith('wave')?cfg.style:'wave1');if(cfg.style.startsWith('wave'))cfg.style='wave';if(cfg.mode!=='playlist')cfg.mode='single';
 activate($('vinylstage'));activate($('wavestage'));activate($('dot'));$('cplay').onclick=toggle;$('play').onclick=toggle;$('loop').onclick=()=>{loop=!loop;audio.loop=loop;paint()};$('seek').oninput=e=>{if(audio.duration)audio.currentTime=+e.target.value/100*audio.duration};$('prev').onclick=()=>load(idx-1,true);$('next').onclick=()=>load(idx+1,true);
 audio.addEventListener('play',()=>{playing=true;paint();if(!raf)animate()});audio.addEventListener('pause',()=>{playing=false;paint();if(raf){cancelAnimationFrame(raf);raf=0}drawWave()});audio.addEventListener('timeupdate',sync);audio.addEventListener('loadedmetadata',sync);audio.addEventListener('ended',()=>{if(loop){audio.currentTime=0;playAudio()}else if(idx<cfg.songs.length-1)load(idx+1,true)});window.addEventListener('resize',drawWave);paint();if(cfg.songs.length)load(0,false);
})();
</script></body></html>
