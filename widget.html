<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cream Audio Player</title>
<style>
:root{--accent:#b9a083;--soft:#e6d9c8;--ink:#403b35;--muted:#9b9083;--paper:#fffdf8;--record:#191919;--label:#e8cf91;--wave:#c8ad91}
body[data-theme="rose"]{--accent:#bd8e91;--soft:#f0dedd;--ink:#594442;--paper:#fff9f7;--label:#e8c4c2;--wave:#d7aaa9}
body[data-theme="sage"]{--accent:#87967e;--soft:#e0e7dc;--ink:#424b40;--paper:#fbfcf8;--label:#d0d9bd;--wave:#aebca4}
body[data-theme="lavender"]{--accent:#a79ab9;--soft:#e8e2ef;--ink:#514a5c;--paper:#fcfaff;--label:#d9cde8;--wave:#c0b2d1}
body[data-theme="night"]{--accent:#c6a878;--soft:#3a332e;--ink:#eee4d7;--paper:#211e1b;--label:#e1c66b;--wave:#b9a18a}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;padding:0;background:transparent!important;font:14px/1.45 Georgia,'Times New Roman',serif;color:var(--ink)}button{font:inherit;cursor:pointer}.wrap{width:100%;margin:0 auto;padding:0;background:transparent}.card{width:100%;background:transparent;position:relative}.ticket{background:var(--paper);border:1px solid #ded8cd;border-radius:8px;box-shadow:0 3px 14px #00000012;min-height:174px;display:grid;grid-template-columns:minmax(0,1fr) 70px;overflow:hidden;color:#272521}.ticketmain{padding:16px 16px 12px 19px;min-width:0}.ticketbrand{font-style:italic;font-size:25px;line-height:1.1;padding-bottom:9px;border-bottom:1px solid #e7e2d9;color:var(--ink)}.ticketmeta{display:flex;justify-content:space-between;gap:8px;color:#a59b8e;font-size:10px;letter-spacing:.16em;margin-top:-2px}.songtitle{font:bold 19px/1.2 Georgia,serif;margin-top:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#282622}.artist{font:14px/1.4 Georgia,serif;color:#81796f;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ticketseek{display:flex;align-items:center;gap:8px;color:#9d958b;font-size:10px;margin-top:12px}.ticketseek input{flex:1;min-width:0;accent-color:var(--accent);height:3px}.ticketcontrols{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:8px}.ticketcontrols button{background:transparent;border:0;color:#403e39;font-size:21px;padding:0 2px}.ticketcontrols .play{font-size:28px}.stub{border-left:2px dashed #e3ddd4;display:flex;flex-direction:column;align-items:center;justify-content:space-around;position:relative;padding:12px 4px}.stub:before,.stub:after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:transparent}.stub:before{top:-8px;box-shadow:0 0 0 20px transparent}.stub:after{bottom:-8px}.barcode{display:flex;gap:3px;height:34px;align-items:stretch}.barcode i{width:3px;background:var(--accent);opacity:.8}.stubword{writing-mode:vertical-rl;font-style:italic;font-size:18px;letter-spacing:.1em;color:var(--accent)}.stamp{font-size:10px;letter-spacing:.1em;border:1px dashed var(--accent);border-radius:50%;padding:8px 4px;color:var(--accent);transform:rotate(-12deg)}
/* Vinyl: the record is the whole widget; no card, track bar or text. */
.vinylstage{height:190px;width:100%;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;outline:none}.vinyl{width:min(178px,62vw);height:min(178px,62vw);max-width:178px;max-height:178px;border-radius:50%;position:relative;background:repeating-radial-gradient(circle at center,#151515 0 2px,#202020 3px 4px,#111 5px 6px,#242424 7px 8px);box-shadow:0 4px 10px #00000020,inset 0 0 0 1px #ffffff12;animation:spin 3.4s linear infinite;animation-play-state:paused}.vinyl:before{content:"";position:absolute;inset:35%;border-radius:50%;background:radial-gradient(circle at 48% 45%,#fff2b5 0 2px,#e4c96c 3px 56%,#b79b48 58% 62%,#e6ce78 64%);box-shadow:inset 0 0 0 1px #806c35}.vinyl:after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid #ffffff12}.arm{position:absolute;width:66px;height:7px;right:calc(50% - 104px);top:19px;transform:rotate(43deg);transform-origin:88% 50%;pointer-events:none}.arm:before{content:"";position:absolute;right:-3px;top:-5px;width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,#eee,#777,#f9f9f9);border:1px solid #aaa}.arm:after{content:"";position:absolute;left:0;top:2px;width:56px;height:3px;border-radius:5px;background:linear-gradient(#eee,#777,#fff);box-shadow:0 1px 2px #0002}.playing .vinyl{animation-play-state:running}.playing .arm{transform:rotate(53deg)}
/* Approved waveform artwork: cropped from the exact approved source image, with transparent background. */
.wavestage{min-height:78px;width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;outline:none;padding:0;background:transparent;border:0;overflow:hidden}
.wavestage canvas{display:block;width:100%;height:auto;max-height:148px;object-fit:contain;object-position:center;filter:none;transform:none;animation:none}
.playing .wavestage canvas{opacity:1}

.compact{display:flex;align-items:center;gap:10px;padding:5px 0}.compact .dot{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,var(--label) 0 18%,#252321 20% 100%);border:0;flex-shrink:0;animation:spin 3s linear infinite;animation-play-state:paused}.compact.playing .dot{animation-play-state:running}.compact .ctext{min-width:0;flex:1}.compact .songtitle{font-size:14px;margin:0}.compact .artist{font-size:12px}.compact button{border:0;background:var(--soft);color:var(--ink);border-radius:50%;width:34px;height:34px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes wave{from{transform:scaleY(.35);opacity:.55}to{transform:scaleY(1);opacity:.95}}@media(prefers-reduced-motion:reduce){.vinyl,.wavebar,.compact .dot{animation:none!important}}
</style></head><body data-theme="cream"><div class="wrap"><main id="card" class="card"><section id="ticket" class="ticket" hidden><div class="ticketmain"><div class="ticketbrand" id="brand">Admit One</div><div class="ticketmeta"><span id="ticketartist">ORIGINAL SOUNDTRACK</span><span>N° 04</span></div><div class="songtitle" id="title">Song title</div><div class="artist" id="artist">Artist</div><div class="ticketseek"><span id="current">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="播放进度"><span id="duration">0:00</span></div><div class="ticketcontrols"><button id="loop" aria-label="单曲循环" title="单曲循环">↻</button><button id="prev" aria-label="上一首">|◀</button><button id="play" class="play" aria-label="播放或暂停">▷</button><button id="next" aria-label="下一首">▶|</button></div></div><aside class="stub"><div class="barcode"><i></i><i></i><i></i><i></i><i></i></div><div class="stubword">Memories</div><div class="stamp">ADMIT</div></aside></section><div id="vinylstage" class="vinylstage" role="button" tabindex="0" aria-label="点击播放或暂停" hidden><div class="vinyl"></div><div class="arm"></div></div><div id="wavestage" class="wavestage" role="button" tabindex="0" aria-label="点击播放或暂停" hidden><canvas id="waveCanvas" width="970" height="330" aria-label="透明声纹"></canvas></div><div id="compact" class="compact" hidden><button class="dot" id="dot" aria-label="播放或暂停"></button><div class="ctext"><div class="songtitle" id="ctitle"></div><div class="artist" id="cartist"></div></div><button id="cplay" aria-label="播放或暂停">▷</button></div></main></div><audio id="audio" preload="metadata"></audio>
<script>
(()=>{
const $=id=>document.getElementById(id),audio=$('audio'),canvas=$('waveCanvas'),ctx=canvas.getContext('2d');
let cfg={style:'ticket',theme:'cream',waveShape:'wave1',waveColor:'original',mode:'single',loop:true,songs:[]},idx=0,loop=true,raf=0,phase=0,analyser=null,analyserData=null,ac=null,source=null,probe=null,probeSource=null,probeGain=null,probeMode=false,maskImg=null,tinted=null,lastShape='',lastColor='';
const fmt=n=>Number.isFinite(n)&&n>=0?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function current(){return cfg.songs[idx]||{title:'Song title',artist:'Artist'}}
const waveFiles={wave1:'assets/wave1-mask.png',wave2:'assets/wave2-mask.png',wave3:'assets/wave3-mask.png',wave4:'assets/wave4-mask.png'};
const palettes={original:{wave1:'#9d7c61',wave2:'#b77f89',wave3:'#7895a2',wave4:'#9185a6'},oat:'#b8a18a',rose:'#b7838d',sage:'#8c9a86',mistblue:'#829ba5',mauve:'#a092a9',apricot:'#c79a82',cocoa:'#927c6d',teal:'#7e9b98',olive:'#96977b',lilac:'#a99ab7',slate:'#7e8f9c',terracotta:'#b78270',plum:'#927b8d',sand:'#b8a58c'};
function colorFor(shape){const p=palettes[cfg.waveColor]||palettes.original;return typeof p==='string'?p:(p[shape]||p.wave1)}
function decode(){try{let raw=new URLSearchParams(location.search).get('data');if(raw){raw=raw.replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';cfg=JSON.parse(decodeURIComponent(escape(atob(raw))))}}catch(e){}}
function prepareArt(){const shape=waveFiles[cfg.waveShape]?cfg.waveShape:'wave1',color=colorFor(shape);if(shape===lastShape&&color===lastColor&&tinted)return;
 lastShape=shape;lastColor=color;maskImg=new Image();maskImg.onload=()=>{canvas.width=maskImg.naturalWidth;canvas.height=maskImg.naturalHeight;tinted=document.createElement('canvas');tinted.width=canvas.width;tinted.height=canvas.height;const t=tinted.getContext('2d');t.clearRect(0,0,tinted.width,tinted.height);t.drawImage(maskImg,0,0);t.globalCompositeOperation='source-in';t.fillStyle=color;t.fillRect(0,0,tinted.width,tinted.height);t.globalCompositeOperation='source-over';renderWave(false)};maskImg.src=waveFiles[shape];}
function renderWave(animated){if(!tinted)return;const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);if(!animated||audio.paused){ctx.drawImage(tinted,0,0);return}
 const bins=analyser&&analyserData; let energy=0;if(bins){analyser.getByteFrequencyData(analyserData);for(let j=0;j<analyserData.length;j++)energy+=analyserData[j];energy/=analyserData.length;}
 const slice=12,center=h/2;for(let x=0;x<w;x+=slice){let v;if(bins&&energy>1.5){const k=Math.min(analyserData.length-1,Math.floor(x/w*analyserData.length));v=analyserData[k]/255;}else{const t=(audio.currentTime||0);v=.22+.36*(.5+.5*Math.sin(t*7.3+x*.045))+.22*(.5+.5*Math.sin(t*3.7+x*.091));}
 const scale=.82+Math.min(1,v)*.36;const dh=h*scale,dy=center-dh/2;ctx.drawImage(tinted,x,0,Math.min(slice,w-x),h,x,dy,Math.min(slice,w-x),dh);
 }
}
function tick(){if(audio.paused){raf=0;renderWave(false);return}phase++;renderWave(true);raf=requestAnimationFrame(tick)}
function motion(){if(audio.paused){if(raf)cancelAnimationFrame(raf);raf=0;renderWave(false)}else if(!raf)raf=requestAnimationFrame(tick)}
function setupAnalyser(){if(analyser||(!window.AudioContext&&!window.webkitAudioContext))return;try{const url=new URL(audio.currentSrc||audio.src,location.href);const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();analyser=ac.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.78;analyserData=new Uint8Array(analyser.frequencyBinCount);if(url.origin===location.origin){source=ac.createMediaElementSource(audio);source.connect(analyser);analyser.connect(ac.destination)}else{probeMode=true;probe=new Audio();probe.crossOrigin='anonymous';probe.preload='auto';probe.loop=loop;probe.src=audio.currentSrc||audio.src;probeSource=ac.createMediaElementSource(probe);probeGain=ac.createGain();probeGain.gain.value=0;probeSource.connect(analyser);analyser.connect(probeGain);probeGain.connect(ac.destination);probe.addEventListener('loadedmetadata',syncProbe);probe.addEventListener('error',()=>{});probe.load();if(!audio.paused)probe.play().catch(()=>{})}}catch(e){analyser=null;analyserData=null;probeMode=false}}
function syncProbe(){if(!probe)return;try{if(Number.isFinite(audio.currentTime)&&Math.abs(probe.currentTime-audio.currentTime)>.3)probe.currentTime=audio.currentTime;if(!audio.paused&&probe.paused)probe.play().catch(()=>{})}catch(e){}}
function refreshProbe(){if(!probeMode||!probe)return;try{probe.pause();probe.src=audio.currentSrc||audio.src;probe.loop=loop;probe.load();if(!audio.paused)probe.play().catch(()=>{})}catch(e){}}
function paint(){let s=current();$('title').textContent=s.title||'Song title';$('artist').textContent=s.artist||'';$('ticketartist').textContent=(s.artist||'ORIGINAL SOUNDTRACK').toUpperCase();$('ctitle').textContent=s.title||'Song title';$('cartist').textContent=s.artist||'';$('play').textContent=audio.paused?'▷':'Ⅱ';$('cplay').textContent=audio.paused?'▷':'Ⅱ';$('loop').style.color=loop?'var(--accent)':'#aaa';$('card').classList.toggle('playing',!audio.paused);$('ticket').hidden=cfg.style!=='ticket';$('vinylstage').hidden=cfg.style!=='vinyl';$('wavestage').hidden=cfg.style!=='wave';$('compact').hidden=cfg.style!=='compact';$('loop').textContent='↻';prepareArt();motion()}
function sync(){let d=audio.duration||0,c=audio.currentTime||0;$('seek').value=d?c/d*100:0;$('current').textContent=fmt(c);$('duration').textContent=fmt(d)}
function load(i,autoplay){if(!cfg.songs.length)return;idx=(i+cfg.songs.length)%cfg.songs.length;audio.src=cfg.songs[idx].url;audio.loop=loop;refreshProbe();paint();if(autoplay){audio.play().then(setupAnalyser).catch(()=>{});}sync()}
function toggle(){if(!cfg.songs.length)return;if(audio.paused){audio.play().then(setupAnalyser).catch(()=>{});}else audio.pause()}
function activate(el){el.addEventListener('click',toggle);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})}
decode();loop=cfg.loop!==false;document.body.dataset.theme=['cream','rose','sage','lavender','night'].includes(cfg.theme)?cfg.theme:'cream';cfg.songs=(Array.isArray(cfg.songs)?cfg.songs:[]).filter(s=>s&&/^https?:/i.test(s.url||''));if(!['ticket','vinyl','wave','compact'].includes(cfg.style))cfg.style='ticket';if(!waveFiles[cfg.waveShape])cfg.waveShape='wave1';if(!palettes[cfg.waveColor])cfg.waveColor='original';if(cfg.mode!=='playlist')cfg.mode='single';activate($('vinylstage'));activate($('wavestage'));activate($('dot'));$('cplay').onclick=toggle;$('play').onclick=toggle;$('loop').onclick=()=>{loop=!loop;audio.loop=loop;paint()};$('seek').oninput=e=>{if(audio.duration)audio.currentTime=+e.target.value/100*audio.duration};$('prev').onclick=()=>load(idx-1,true);$('next').onclick=()=>load(idx+1,true);audio.addEventListener('play',()=>{paint();setupAnalyser();if(probeMode&&probe)probe.play().catch(()=>{});motion()});audio.addEventListener('pause',()=>{if(probeMode&&probe)probe.pause();paint();motion()});audio.addEventListener('timeupdate',()=>{sync();syncProbe()});audio.addEventListener('loadedmetadata',sync);audio.addEventListener('ended',()=>{if(loop){audio.currentTime=0;audio.play().catch(()=>{})}else if(idx<cfg.songs.length-1)load(idx+1,true)});paint();if(cfg.songs.length)load(0,false);
})();;
</script></body></html>
